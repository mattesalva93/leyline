packages:
  - packages/*

# Fail an install whose package lost trust (trusted publisher, provenance) since its earlier releases.
trustPolicy: no-downgrade

audit:
  level: high
  ignore:
    # picomatch ReDoS, no fixed version yet. It reaches only dev tooling (vite, knip), never the
    # production dependencies (`pnpm audit --prod`), and its globs come from our own config.
    - GHSA-fc5q-39xc-vjpf

peerDependencyRules:
  allowedVersions:
    # It runs on ESLint 10 through @eslint/compat's fixupPluginRules (eslint.config.js).
    eslint-plugin-react>eslint: '10'
    # `tsc` is TypeScript 7 under this alias; typescript-eslint reads the TS 6 API from the
    # `typescript` alias, and loads this one only for its opt-in native backend, which needs 7.1.
    '@typescript-eslint/typescript-estree>@typescript/native': '7.0'
