# Vulnerabilities in the images that no update on our side fixes yet. Each one expires, so CI
# fails again once the base image has had time to ship the fix: then update it, or renew the entry.
vulnerabilities:
  - id: CVE-2026-85091
    statement: >-
      zlib1g of the node:26.13.0-slim base image, fixed in Debian but not yet in the image.
      Node links its own copy of zlib, not the system library (ldd /usr/local/bin/node).
    expired_at: 2026-12-18
  - id: CVE-2026-78661
    statement: >-
      golang.org/x/net/html inside the Caddy binary of caddy:2.11-alpine, unfixed in the latest
      Caddy release (v2.11.9). Our Caddyfile uses no handler that parses HTML (templates, markdown).
    expired_at: 2026-12-18
