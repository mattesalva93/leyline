# Every service's own log rotates, instead of growing without limit (ADR 0016). `local`, unlike
# Docker's default `json-file`, rotates by itself; `pnpm check:staging` pins that every log does.
x-rotated-logs: &rotated-logs
  logging:
    driver: local
    options: { max-size: 10m, max-file: '3' }

# Every service runs with the least privilege (ADR 0016): no write outside its volumes and
# `tmpfs`, no Linux capability, and no way to gain one. `pnpm check:staging` pins all of it.
x-least-privilege: &least-privilege
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges]

# Each service's `deploy.resources.limits` keep it from starving the others (ADR 0016), and leave
# the alpha's VPS (research/vps-alpha-hosting.md) room for the host and for building the images
# there (ADR 0012). Memory: above each service's peak during a full import on staging, read from
# its cgroup (`/sys/fs/cgroup/memory.peak`), page cache included.
services:
  web:
    <<: [*rotated-logs, *least-privilege]
    build:
      context: .
      target: web
      # Built into the bundle: the browser reports its errors and records product events only
      # with them (ADR 0027).
      args:
        VITE_BUGSINK_DSN: '${VITE_BUGSINK_DSN:-}'
        VITE_UMAMI_WEBSITE_ID: '${VITE_UMAMI_WEBSITE_ID:-}'
    deploy: { resources: { limits: { memory: 256m, cpus: '1' } } }
    # Rebuild on every `up`, so a manual test never runs a stale image (layer cache keeps it fast).
    pull_policy: build
    # Loopback on staging; production sets PUBLISH_ADDRESS=0.0.0.0 to take public traffic.
    ports:
      - '${PUBLISH_ADDRESS:-127.0.0.1}:80:80'
      - '${PUBLISH_ADDRESS:-127.0.0.1}:443:443'
      - '${PUBLISH_ADDRESS:-127.0.0.1}:443:443/udp' # HTTP/3
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
      # Where Caddy forwards the browser's error reports (ADR 0027): empty, it forwards none.
      BUGSINK_ORIGIN: ${BUGSINK_ORIGIN:-}
      BUGSINK_PROJECT_ID: ${BUGSINK_PROJECT_ID:-}
    networks: [internet, proxy, analytics]
    volumes:
      # Certificates and the local CA: losing them means new certificates on every start.
      - caddy-data:/data
      - caddy-config:/config
      # The access log, rotated by Caddy itself (Caddyfile).
      - caddy-logs:/var/log/caddy
      # The testers' guard, never in the image or the repository: on while the folder holds it
      # (ADR 0023, docs/staging.md). A folder, not a file, so Caddy sees the guard written or
      # removed on its next reload.
      - type: bind
        source: ./docker/web/tester-guard
        target: /etc/caddy/tester-guard
        read_only: true
        bind: { create_host_path: false }
    restart: unless-stopped
    # Healthy once Caddy serves the built SPA.
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8081/index.html']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      api:
        condition: service_healthy

  api:
    <<: [*rotated-logs, *least-privilege]
    build: { context: ., target: api }
    deploy: { resources: { limits: { memory: 256m, cpus: '1' } } }
    pull_policy: build
    environment:
      READER_DATABASE_URL: postgres://leyline_reader:${LEYLINE_READER_PASSWORD:?set LEYLINE_READER_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-leyline}
      # Inside the container, listen on every interface so `web` can reach it.
      HOST: 0.0.0.0
      PORT: 3000
      # The only proxy whose X-Forwarded-For the api believes: Caddy, in the `web` service.
      TRUSTED_PROXY_HOST: web
      # Its server errors go to Bugsink through Caddy's internal listener, never out (ADR 0027):
      # the same DSN as the browser's, and empty, it reports none.
      BUGSINK_DSN: ${VITE_BUGSINK_DSN:-}
      ERROR_REPORTS_URL: http://web:8082/error-reports
    # Caddy's requests in, the database out, and nothing else: the api calls no outside service.
    networks: [proxy, database]
    restart: unless-stopped
    # The image has no curl or wget: Node's own fetch asks the api. Healthy once it serves
    # requests and the importer has created the schema, so `up --wait` fails on an api stuck
    # restarting.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy

  # Imports Scryfall's catalog once a day (ADR 0002), apart from the process serving requests.
  importer:
    <<: [*rotated-logs, *least-privilege]
    build: { context: ., target: api }
    pull_policy: build
    command: ['node', 'dist/import-daily.js']
    deploy: { resources: { limits: { memory: 512m, cpus: '1' } } }
    # It migrates the database before importing: the api only reads it (ADR 0016).
    environment:
      OWNER_DATABASE_URL: postgres://leyline_owner:${LEYLINE_OWNER_PASSWORD:?set LEYLINE_OWNER_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-leyline}
      # Its check-ins to Healthchecks.io (ADR 0027), off while empty.
      HEALTHCHECKS_PING_URL: ${HEALTHCHECKS_PING_URL:-}
    # Scryfall's bulk files in and the check-ins out, the database out.
    networks: [internet, database]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  # Product analytics (ADR 0027): Caddy forwards it only the path that receives events, and the
  # owner opens its dashboard through an SSH tunnel (docs/deploy.md). No route out of Docker.
  umami:
    <<: [*rotated-logs, *least-privilege]
    # Pinned by digest, like the Dockerfile's base images; `pnpm deps:outdated` checks both.
    image: umamisoftware/umami:3.5.0@sha256:0e7895d368e94b1b1dbd45eae4e2fb093ffbabfe498473579da4d7c7f3fe6c6c
    # Its peak on staging, 234 MiB, came from starting and taking 500 events at once.
    deploy: { resources: { limits: { memory: 384m, cpus: '1' } } }
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DATABASE_PASSWORD:?set UMAMI_DATABASE_PASSWORD in .env}@postgres:5432/umami
      # Signs its login sessions and enters every session's hash.
      APP_SECRET: ${UMAMI_APP_SECRET:?set UMAMI_APP_SECRET in .env}
      # A visitor's session hash changes every day (ADR 0027); Caddy passes it no address to hash.
      SALT_ROTATION: daily
      # No telemetry and no update check, from the server or from the dashboard's page.
      DISABLE_TELEMETRY: '1'
      DISABLE_UPDATES: '1'
    networks: [analytics, database]
    restart: unless-stopped
    # Next.js caches what it serves there, and an unhandled error ends any request it cannot.
    tmpfs: [/app/.next/cache]
    healthcheck:
      test: ['CMD', 'curl', '-fsS', '-o', '/dev/null', 'http://127.0.0.1:3000/api/heartbeat']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    <<: [*rotated-logs, *least-privilege]
    # Pinned by digest, like the Dockerfile's base images; `umami-retention` runs its `psql`.
    image: &postgres-image postgres:18-alpine@sha256:0115267ab5a509022df9319c77be365cef335adb71556c75f60f5360ee247e71
    # The image's own `postgres` user from the start, instead of root switching to it.
    user: postgres
    # Its shared buffers count towards the limit too.
    deploy: { resources: { limits: { memory: 1g, cpus: '1.5' } } }
    # The superuser only initialises the database: docker/postgres/init creates the roles the
    # api and the importer connect as. Their passwords have no default (`:?` stops compose without
    # them), so a host never runs on a password everyone can read here.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-leyline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-leyline}
      POSTGRES_DB: ${POSTGRES_DB:-leyline}
      LEYLINE_OWNER_PASSWORD: ${LEYLINE_OWNER_PASSWORD:?set LEYLINE_OWNER_PASSWORD in .env}
      LEYLINE_READER_PASSWORD: ${LEYLINE_READER_PASSWORD:?set LEYLINE_READER_PASSWORD in .env}
      UMAMI_DATABASE_PASSWORD: ${UMAMI_DATABASE_PASSWORD:?set UMAMI_DATABASE_PASSWORD in .env}
    # No port, not even on loopback: `pnpm db:up` runs a database of its own for `pnpm dev` and
    # the tests (compose.dev.yaml).
    networks: [database]
    restart: unless-stopped
    # Its socket and lock files, apart from the data in the volume.
    tmpfs: [/var/run/postgresql, /tmp]
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10

  # Deletes Umami's data past its retention once a day (ADR 0027), as Umami's role.
  umami-retention:
    <<: [*rotated-logs, *least-privilege]
    image: *postgres-image
    user: postgres
    command: ['sh', '/etc/umami-retention/daily-retention.sh']
    deploy: { resources: { limits: { memory: 32m, cpus: '0.5' } } }
    # libpq's own variables: `psql` signs in with them, and needs no argument for it.
    environment:
      PGHOST: postgres
      PGDATABASE: umami
      PGUSER: umami
      PGPASSWORD: ${UMAMI_DATABASE_PASSWORD:?set UMAMI_DATABASE_PASSWORD in .env}
    networks: [database]
    restart: unless-stopped
    volumes:
      - ./docker/umami-retention:/etc/umami-retention:ro
    # Umami creates its tables when it starts.
    depends_on:
      umami:
        condition: service_healthy

# `internal` networks have no route out of Docker: only the services on them reach each other.
networks:
  # Published ports and outgoing traffic: visitors reach Caddy, Caddy reaches Bugsink, the
  # importer reaches Scryfall.
  internet:
  # Caddy forwarding /api to the api, and the api's error reports to Caddy.
  proxy:
    internal: true
  # Caddy forwarding the product events to Umami.
  analytics:
    internal: true
  # PostgreSQL and its clients: the api, the importer, Umami and its retention job.
  database:
    internal: true

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
  caddy-logs:
