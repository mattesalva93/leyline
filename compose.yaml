# Every service's own log rotates, instead of growing without limit (ADR 0016). `local`, unlike
# Docker's default `json-file`, rotates by itself; `pnpm check:staging` pins that every log does.
x-rotated-logs: &rotated-logs
  logging:
    driver: local
    options: { max-size: 10m, max-file: '3' }

services:
  web:
    <<: *rotated-logs
    build: { context: ., target: web }
    # Rebuild on every `up`, so a manual test never runs a stale image (layer cache keeps it fast).
    pull_policy: build
    # Loopback on staging; production sets PUBLISH_ADDRESS=0.0.0.0 to take public traffic.
    ports:
      - '${PUBLISH_ADDRESS:-127.0.0.1}:80:80'
      - '${PUBLISH_ADDRESS:-127.0.0.1}:443:443'
      - '${PUBLISH_ADDRESS:-127.0.0.1}:443:443/udp' # HTTP/3
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    volumes:
      # Certificates and the local CA: losing them means new certificates on every start.
      - caddy-data:/data
      - caddy-config:/config
      # The access log, rotated by Caddy itself (Caddyfile).
      - caddy-logs:/var/log/caddy
      # The testers' credentials, never in the image or the repository (docs/staging.md).
      # `create_host_path: false`: a missing file stops `up`, instead of Docker mounting an
      # empty directory in its place.
      - type: bind
        source: ./docker/web/tester-credentials.caddy
        target: /etc/caddy/tester-credentials.caddy
        read_only: true
        bind: { create_host_path: false }
    restart: unless-stopped
    # Healthy once Caddy serves the built SPA.
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8081/index.html']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      api:
        condition: service_healthy

  api:
    <<: *rotated-logs
    build: { context: ., target: api }
    pull_policy: build
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-mtg}:${POSTGRES_PASSWORD:-mtg}@postgres:5432/${POSTGRES_DB:-mtg_suite}
      # Inside the container, listen on every interface so `web` can reach it.
      HOST: 0.0.0.0
      PORT: 3000
    restart: unless-stopped
    # The image has no curl or wget: Node's own fetch asks the api. Healthy once it has migrated
    # the database and serves requests, so `up --wait` fails on an api stuck restarting.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy

  # Imports Scryfall's catalog once a day (ADR 0002), apart from the process serving requests.
  importer:
    <<: *rotated-logs
    build: { context: ., target: api }
    pull_policy: build
    command: ['node', 'dist/import-daily.js']
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-mtg}:${POSTGRES_PASSWORD:-mtg}@postgres:5432/${POSTGRES_DB:-mtg_suite}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    <<: *rotated-logs
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mtg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mtg}
      POSTGRES_DB: ${POSTGRES_DB:-mtg_suite}
    restart: unless-stopped
    # Loopback only, for `pnpm dev` and the tests: the database never faces the network,
    # since Docker's port rules bypass host firewalls such as ufw.
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
  caddy-logs:
