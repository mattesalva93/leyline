name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # Real PostgreSQL for the `api` integration tests (ADR 0003). Same image as compose.yaml.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: mtg
          POSTGRES_PASSWORD: mtg
          POSTGRES_DB: mtg_suite
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mtg -d mtg_suite"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://mtg:mtg@localhost:5432/mtg_suite
    steps:
      - uses: actions/checkout@v7
      # Installs node and pnpm at the versions pinned in mise.toml.
      - uses: jdx/mise-action@v5
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
