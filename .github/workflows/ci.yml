name: CI

on:
  push:
  pull_request:

# No token permission by default: each job asks for what it needs.
permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Real PostgreSQL for the `api` integration tests (ADR 0003). Same image as compose.yaml.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: mtg
          POSTGRES_PASSWORD: mtg
          POSTGRES_DB: mtg_suite
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mtg -d mtg_suite"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://mtg:mtg@localhost:5432/mtg_suite
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Installs node, pnpm and the scanners at the versions pinned in mise.toml.
      - uses: jdx/mise-action@v5
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build

  workflows:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5
      # zizmor's online audits (impostor commits, known vulnerable actions) query the GitHub API.
      - run: zizmor --format=github .github/workflows
        env:
          GH_TOKEN: ${{ github.token }}
      - run: gh extension install github/gh-actions-lock --pin v0.4.1
        env:
          GH_TOKEN: ${{ github.token }}
      # Fails when actions.lock is out of sync with the workflows or a pin no longer verifies.
      - run: gh actions-lock --verify
        env:
          GH_TOKEN: ${{ github.token }}

  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # The whole history: a secret removed by a later commit is still leaked.
          fetch-depth: 0
      - uses: jdx/mise-action@v5
      - run: gitleaks git --redact --verbose

  dependencies:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5
      # Severity threshold and accepted advisories: `audit` in pnpm-workspace.yaml.
      - run: pnpm audit

  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5
      - run: docker compose build
      # Every image compose.yaml builds, under the `<project>-<service>` name compose tags it with.
      # `--ignore-unfixed`: a vulnerability with no fixed version yet gives nothing to update.
      # `.trivyignore.yaml`: the ones fixed upstream that our base images do not ship yet.
      - run: |
          docker compose config --format json \
            | jq -r '.name as $project | .services | to_entries[] | select(.value.build) | "\($project)-\(.key)"' \
            | sort -u \
            | xargs -n 1 trivy image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --ignorefile .trivyignore.yaml --no-progress
