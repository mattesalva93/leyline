name: Deploy

# Off until a VPS is chosen: the job runs only once the repository variable DEPLOY_ENABLED is
# 'true' (ADR 0012). Any host with SSH and Docker Compose works; see docs/deploy.md.
on:
  # zizmor flags every workflow_run. This one checks out only a push to this repository's own
  # main that CI passed: see the job's `if`.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# No token permission by default: each job asks for what it needs.
permissions: {}

# One deploy at a time; a newer one waits instead of cancelling a half-done `up`.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    # `branches: [main]` only matches the branch *name*: a pull request from a fork's own `main`
    # passes it. Only a push to this repository's main may deploy.
    if: >-
      vars.DEPLOY_ENABLED == 'true' && (
        (github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_repository.full_name == github.repository) ||
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment: production
    env:
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          # The commit CI passed on, not whatever main holds by now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          SSH_HOST: ${{ vars.DEPLOY_HOST }}
          SSH_USER: ${{ vars.DEPLOY_USER }}
          SSH_PORT: ${{ vars.DEPLOY_PORT || '22' }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # A pinned host key: never trust whatever answers on first connection.
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host deploy\n  HostName %s\n  User %s\n  Port %s\n  IdentityFile ~/.ssh/deploy_key\n  StrictHostKeyChecking yes\n' \
            "$SSH_HOST" "$SSH_USER" "$SSH_PORT" > ~/.ssh/config

      # The host builds the images itself, from the tracked files only: its .env stays untouched.
      # DEPLOY_PATH expands on the runner on purpose: the host has no such variable.
      - name: Copy the sources
        run: |
          # shellcheck disable=SC2029
          git archive --format=tar HEAD | ssh deploy "mkdir -p '$DEPLOY_PATH' && tar -x -C '$DEPLOY_PATH'"

      # The emergency switch (ADR 0023): a secret holding credential lines turns the testers'
      # guard on, an empty or missing one turns it off and the site is open. The secret reaches
      # the host through stdin only, never on a command line or in the log. Readable by anyone
      # on the host (`chmod 644`): Caddy reads it as its own user, not the deploy user, and the
      # file holds only argon2id hashes, never a password.
      - name: Switch the testers' guard
        env:
          TESTER_CREDENTIALS: ${{ secrets.TESTER_CREDENTIALS }}
        run: |
          guard_file="$DEPLOY_PATH/docker/web/tester-guard/basic-auth.caddy"
          guard=$(printf '%s\n' "$TESTER_CREDENTIALS" | sh scripts/tester-guard.sh)
          if [ -n "$guard" ]; then
            # shellcheck disable=SC2029
            printf '%s\n' "$guard" | ssh deploy "cat > '$guard_file' && chmod 644 '$guard_file'"
            echo "The testers' guard is on: only their credentials open the site."
          else
            # shellcheck disable=SC2029
            ssh deploy "rm -f '$guard_file'"
            echo "The testers' guard is off: the site is open."
          fi

      # Umami's database and role (ADR 0027): PostgreSQL creates them only with a new volume, so on
      # one that exists, such as production's, the superuser creates them here, before Umami starts.
      # Run again, the script creates nothing.
      - name: Create Umami's database
        run: |
          # shellcheck disable=SC2029
          ssh deploy "cd '$DEPLOY_PATH' && docker compose up -d --wait postgres &&
            docker compose exec -T postgres sh /docker-entrypoint-initdb.d/03-umami-database.sh"

      # `up` keeps a container whose image did not change, so Caddy reloads its configuration
      # too: the guard switched, or a revoked tester, takes effect with this deploy, not with the
      # next new image.
      - name: Rebuild and restart
        run: |
          # shellcheck disable=SC2029
          ssh deploy "cd '$DEPLOY_PATH' && docker compose up -d --wait --remove-orphans &&
            docker compose exec -T web caddy reload --config /etc/caddy/Caddyfile"

  # A release that went online gets its fixed name (ADR 0025): the tag `vX.Y.Z` of package.json's
  # version on the deployed commit, and its GitHub Release. A job of its own, after a deploy that
  # succeeded, so that only it holds `contents: write`; a failed deploy tags nothing. It has no
  # `if` of its own: `needs` skips it whenever the deploy job is skipped or fails.
  release:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          # The whole history and its tags: the notes list the commits since the previous tag.
          fetch-depth: 0
          fetch-tags: true
      # No setup action: the runner's own node runs the notes script, and an action here would be
      # handed this job's write token. The token reaches only gh, through the environment; the
      # checkout keeps no credential. A deploy run again by hand finds its tag already there.
      - name: Tag the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEPLOYED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          tag="v$(jq -r .version package.json)"
          # rev-parse --verify --quiet: succeeds, silently, only when the tag exists.
          if git rev-parse --verify --quiet "refs/tags/$tag" > /dev/null; then
            echo "$tag already exists: nothing to do."
            exit 0
          fi
          node scripts/release-notes.js "$tag" > "$RUNNER_TEMP/notes.md"
          # gh creates the tag too, on the commit --target names.
          gh release create "$tag" --target "$DEPLOYED_SHA" --title "$tag" --notes-file "$RUNNER_TEMP/notes.md"
          echo "Released $tag on $DEPLOYED_SHA."
