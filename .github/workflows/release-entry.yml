name: Release entry

# Runs on every pull request, whatever its branches: it is a required check of the ruleset
# (ADR 0024), and a required check that never starts would leave the pull request waiting.
# Only a pull request to main is checked (ADR 0025); the others pass at once.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

# No token permission by default: each job asks for what it needs.
permissions: {}

concurrency:
  group: release-entry-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  release-entry:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          # The pull request's merge commit and its first parent, the base branch.
          fetch-depth: 2
      # Only node: the check needs none of the other tools pinned in mise.toml.
      - uses: jdx/mise-action@v5.3.0
        with:
          install_args: node
      - run: node scripts/check-release.js
        env:
          BASE_REF: ${{ github.base_ref }}
